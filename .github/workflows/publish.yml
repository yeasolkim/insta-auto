name: 인스타 자동 업로드

on:
  workflow_dispatch:
    inputs:
      folder:
        description: "올릴 폴더 (예: posts/2026-11-10 또는 posts/now-20261106-1530)"
        required: true
  schedule:
    - cron: "0 0 * * *"   # 매일 오전 9시(한국 시간). GitHub 사정으로 몇십 분 늦을 수 있음

permissions:
  contents: write

concurrency: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: 올릴 폴더 결정
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.folder }}" ]; then
            FOLDER="${{ github.event.inputs.folder }}"
            [ -d "$FOLDER" ] || { echo "오류: $FOLDER 폴더가 없음"; exit 1; }
          else
            FOLDER="posts/$(TZ=Asia/Seoul date +%F)"
            [ -d "$FOLDER" ] || { echo "오늘 예약된 게시물 없음"; exit 0; }
          fi
          echo "folder=$FOLDER" >> "$GITHUB_OUTPUT"

      - name: 인스타에 게시
        if: steps.pick.outputs.folder != ''
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMG_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
        run: python publish.py "${{ steps.pick.outputs.folder }}"

      - name: 올린 표시 저장
        if: steps.pick.outputs.folder != ''
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A posts
          git diff --cached --quiet || git commit -m "게시 완료: ${{ steps.pick.outputs.folder }}"
          git push
